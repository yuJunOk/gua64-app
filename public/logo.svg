<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主题蓝色渐变 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    
    <!-- 白色渐变 -->
    <linearGradient id="white" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    
    <!-- 发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="8" dy="16" stdDeviation="20" flood-color="#1e40af" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="280" ry="280"/>
  
  <!-- 装饰圆环 - 左上 -->
  <circle cx="200" cy="200" r="120" fill="#60a5fa" opacity="0.15"/>
  <circle cx="200" cy="200" r="80" fill="#93c5fd" opacity="0.2"/>
  
  <!-- 装饰圆环 - 右下 -->
  <circle cx="850" cy="850" r="100" fill="#60a5fa" opacity="0.1"/>
  
  <!-- 主图形 - 倾斜的六边形 -->
  <g transform="translate(512, 512) rotate(15)" filter="url(#shadow)">
    <!-- 外发光环 -->
    <circle r="360" fill="none" stroke="#60a5fa" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
    
    <!-- 六边形背景 -->
    <polygon points="0,-320 277,-160 277,160 0,320 -277,160 -277,-160" 
             fill="url(#white)"/>
    
    <!-- 六边形边框 -->
    <polygon points="0,-320 277,-160 277,160 0,320 -277,160 -277,-160" 
             fill="none" stroke="#2563eb" stroke-width="6"/>
    
    <!-- 益卦（䷩）六爻 - 旋转回正常角度 -->
    <!-- 益卦：下震上巽 -->
    <!-- 从下往上：初九(阳)、六二(阴)、六三(阴)、六四(阴)、九五(阳)、上九(阳) -->
    <g transform="rotate(-15)">
      <!-- 上九 - 阳爻（闭合） -->
      <rect x="-130" y="-140" width="260" height="32" rx="16" fill="#2563eb"/>
      <!-- 九五 - 阳爻（闭合） -->
      <rect x="-130" y="-85" width="260" height="32" rx="16" fill="#2563eb"/>
      <!-- 六四 - 阴爻（断开） -->
      <rect x="-130" y="-30" width="110" height="32" rx="16" fill="#2563eb"/>
      <rect x="20" y="-30" width="110" height="32" rx="16" fill="#2563eb"/>
      <!-- 六三 - 阴爻（断开） -->
      <rect x="-130" y="25" width="110" height="32" rx="16" fill="#2563eb"/>
      <rect x="20" y="25" width="110" height="32" rx="16" fill="#2563eb"/>
      <!-- 六二 - 阴爻（断开） -->
      <rect x="-130" y="80" width="110" height="32" rx="16" fill="#2563eb"/>
      <rect x="20" y="80" width="110" height="32" rx="16" fill="#2563eb"/>
      <!-- 初九 - 阳爻（闭合） -->
      <rect x="-130" y="135" width="260" height="32" rx="16" fill="#2563eb"/>
    </g>
  </g>
  
  <!-- 浮动装饰点 -->
  <circle cx="150" cy="800" r="20" fill="#93c5fd" opacity="0.4"/>
  <circle cx="900" cy="180" r="15" fill="#bfdbfe" opacity="0.3"/>
  <circle cx="300" cy="100" r="10" fill="#dbeafe" opacity="0.5"/>
</svg>